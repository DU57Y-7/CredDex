<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organisation · CredDex</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cd.css">
<style>#bq::placeholder{color:#555;opacity:1}</style>
</head>
<body>
<header>
  <h1><a href="index.html">CredDex</a><small>Organisation</small></h1>
  <div class="acts"><a class="btn" href="companies.html">All organisations</a><a class="btn" href="index.html">Home</a></div>
</header>
<div class="vwrap" style="max-width:760px">
  <div id="v"><p class="muted">Loading…</p></div>
</div>
<footer class="foot" id="ft2"></footer>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="cd.js"></script>
<script>
(function(){
var $=CD.$,esc=CD.esc,sb=CD.sb;
$("ft2").innerHTML=CD.footer();
(async function(){
var v=$("v"),slug=new URLSearchParams(location.search).get("o")||"";
var r=slug?await sb.rpc("public_org",{p_slug:slug}):{data:[]};
if(r.error||!r.data||!r.data.length){v.innerHTML='<h2>Organisation not found</h2>';return}
var o=r.data[0],w=CD.safeUrl(o.website),bs=o.badges||[],to=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.contact_email||"")?o.contact_email:CD.MAIL,N=12,shown=N;
document.title=o.name+" · CredDex";
var fams=[];bs.forEach(function(b){if(b.family&&fams.indexOf(b.family)<0)fams.push(b.family)});
var big=bs.length>=3;
v.innerHTML='<h2>'+esc(o.name)+'</h2>'+(o.description?'<p style="white-space:pre-wrap">'+esc(o.description)+'</p>':"")+
 '<div class="row" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">'+(w?'<a class="btn cb" href="'+esc(w)+'" target="_blank" rel="noopener noreferrer">Website</a>':"")+'<a class="btn cb" href="mailto:'+esc(to)+'">Email</a></div><h3>Badges ('+bs.length+')</h3>'+
 (big?'<div class="row" style="margin:0 0 28px"><input id="bq" placeholder="Search badges" style="flex:1;min-width:180px;color:#000;background:#fff;padding:10px 12px;border:1px solid #888;border-radius:10px;font:inherit">'+(fams.length>1?'<select id="bf" style="color:#000;background:#fff;padding:10px 12px;border:1px solid #888;border-radius:10px;font:inherit"><option value="">All families</option>'+fams.map(function(f){return '<option>'+esc(f)+'</option>'}).join("")+'</select>':"")+'</div>':"")+
 '<div id="bg" style="display:grid;gap:18px 14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));align-items:start"></div><div class="row" id="bm" hidden><button class="btn cb" id="bmb"></button></div>';
function tile(b){var img=b.image_path?'<img src="'+esc(CD.artUrl(b.image_path))+'" alt="" loading="lazy" style="max-width:100%;max-height:100%;object-fit:contain">':CD.badge({issuer:o.name,name:b.name,img:""});
 return '<a href="badge.html?t='+encodeURIComponent(b.id)+'" style="display:flex;flex-direction:column;align-items:center;text-decoration:none;color:inherit"><div style="width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center">'+img+'</div><div style="margin-top:8px;text-align:center;font-weight:600;min-height:2.6em">'+esc(b.name)+'</div></a>'}
function draw(){var q=($("bq")?$("bq").value:"").trim().toLowerCase(),f=$("bf")?$("bf").value:"",l=bs.filter(function(b){return(!f||b.family===f)&&(!q||String(b.name).toLowerCase().indexOf(q)>=0)});
 $("bg").innerHTML=l.slice(0,shown).map(tile).join("")||'<p class="muted">No badges match.</p>';
 $("bm").hidden=l.length<=shown;$("bmb").textContent="Show more ("+(l.length-shown)+")"}
if($("bq"))$("bq").oninput=function(){shown=N;draw()};if($("bf"))$("bf").onchange=function(){shown=N;draw()};
$("bmb").onclick=function(){shown+=N;draw()};draw();
})();
})();
</script>
</body>
</html>
